<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Accès protégé — Paul Dessaux</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --bg: #fafafa; --text: #1a1a1a; --text-secondary: #555;
      --accent: #2563eb; --accent-hover: #1d4ed8;
      --border: #e5e5e5; --radius: 10px;
    }
    body {
      margin: 0; padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .lock-box {
      text-align: center; max-width: 360px; padding: 24px;
    }
    .lock-icon {
      font-size: 2.4rem; margin-bottom: 16px; opacity: 0.7;
    }
    .lock-box h1 {
      font-size: 1.15rem; font-weight: 600; margin: 0 0 20px;
      letter-spacing: -0.01em;
    }
    .lock-box input {
      width: 100%; padding: 10px 14px;
      border: 1px solid var(--border); border-radius: var(--radius);
      font-family: inherit; font-size: 0.95rem;
      outline: none; transition: border-color 0.15s;
      background: #fff;
    }
    .lock-box input:focus {
      border-color: var(--accent);
    }
    .lock-box button {
      margin-top: 12px; width: 100%; padding: 10px 0;
      background: var(--accent); color: #fff; border: none;
      border-radius: var(--radius); font-family: inherit;
      font-size: 0.92rem; font-weight: 500; cursor: pointer;
      transition: background 0.15s;
    }
    .lock-box button:hover {
      background: var(--accent-hover);
    }
    .error-msg {
      color: #dc2626; font-size: 0.82rem; margin-top: 10px;
      min-height: 1.2em;
    }
    .back-link {
      display: inline-block; margin-top: 20px;
      color: var(--text-secondary); text-decoration: none;
      font-size: 0.85rem; font-weight: 500;
      transition: color 0.15s;
    }
    .back-link:hover { color: var(--accent); }
  </style>
</head>
<body>
  <div class="lock-box">
    <div class="lock-icon">🔒</div>
    <h1>Contenu protégé</h1>
    <form id="unlock-form" autocomplete="off">
      <input type="password" id="pwd" placeholder="Mot de passe" autofocus>
      <button type="submit">Déverrouiller</button>
    </form>
    <div class="error-msg" id="err"></div>
    <a href="index.html" class="back-link">← Retour</a>
  </div>

    function b64ToBytes(b64) {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return bytes;
    }

    document.getElementById("unlock-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const pwd = document.getElementById("pwd").value;
      const errEl = document.getElementById("err");
      errEl.textContent = "";

      try {
        const enc = new TextEncoder();
        const keyMaterial = await crypto.subtle.importKey(
          "raw", enc.encode(pwd), "PBKDF2", false, ["deriveKey"]
        );
        const key = await crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: b64ToBytes(SALT), iterations: 100000, hash: "SHA-256" },
          keyMaterial,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"]
        );
        const decrypted = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: b64ToBytes(IV) },
          key,
          b64ToBytes(CT)
        );
        const html = new TextDecoder().decode(decrypted);
        document.open();
        document.write(html);
        document.close();
      } catch (ex) {
        errEl.textContent = "Mot de passe incorrect.";
        document.getElementById("pwd").value = "";
        document.getElementById("pwd").focus();
      }
    });
  </script>
